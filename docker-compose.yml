# Local / manual runs: put secrets in .env (never commit .env).
# Jenkins deploy writes .env from Infisical and uses: docker run --env-file .env.
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: traverior-api
    env_file:
      - ./api/.env
    volumes:
      - ./api/logs:/app/logs
    ports:
      - "8002:3000"
